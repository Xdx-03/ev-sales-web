name: Suite Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/validate_commit_messages.py "$BASE_SHA" "$HEAD_SHA"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Compile
        run: python -m compileall -q ev_web tests framework_checks scripts run_web_tests.py

      - name: Collect business Web and H5 scenarios (no browser execution)
        run: python -m pytest --collect-only -q

      - name: Execute framework contracts (synthetic data, no browser)
        run: python -m pytest framework_checks -q --junitxml=reports/framework-checks.xml

      - name: Upload synthetic framework check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-framework-checks-junit
          path: reports/framework-checks.xml
          if-no-files-found: warn
          retention-days: 14
