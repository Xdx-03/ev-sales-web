[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
markers =
    ui: browser-based black-box UI scenario
    live: requires a running management Web environment
    smoke: fast high-value confidence check
    regression: broader functional regression scenario
    critical: release-blocking business scenario
    auth: authentication scenario
    permission: access-control or route-guard scenario
    mobile: mobile viewport browser scenario
    h5: uni-app H5 scenario
