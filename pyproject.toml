[project]
name = "ev-sales-web"
version = "0.1.0"
description = "Black-box Playwright UI automation for the EV Sales management Web app"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["ev_web", "tests", "framework_checks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C90", "PLR", "SIM", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["ev_web", "tests", "framework_checks", "run_web_tests.py"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
